# Copy into Play Console → App content → Data safety
collects_data: false
ads: false
target_audience: 18+
designed_for_families: false
encryption_in_transit: not_applicable_no_account_backend
encryption_at_rest: true
users_can_request_deletion: true
deletion_url: https://shahvikask.github.io/kosha/delete-account.html
privacy_policy_url: https://shahvikask.github.io/kosha/privacy.html
terms_url: https://shahvikask.github.io/kosha/terms.html

# User-chosen encrypted backups (optional). The developer does not operate Drive/OneDrive.
user_initiated_backups:
  - encrypted_kosha_file_to_user_picked_folder
  destinations:
    - google_drive_if_user_picks_it
    - onedrive_if_user_picks_it
    - downloads_or_other_document_tree
  sent_to_developer: false
  password_stored_by_app: false

# Play Billing (Google's collection, declare as collected by third party if the form asks)
play_billing:
  - purchase_history
  - device_or_other_ids
  purpose: app_functionality
  shared_with: google_play
  optional: false

# Play In-App Review (Google's collection). The app only opens Play's sheet.
play_reviews:
  - user_generated_content
  purpose: other
  shared_with: google_play
  optional: true
  collected_by: google
  sent_to_developer_servers: false

# Vault fields stored ON DEVICE only — if the form has "collected by the app" vs "sent off device"
on_device_only:
  - name
  - email_as_username
  - pan
  - date_of_birth
  - financial_info
  sent_off_device: false
