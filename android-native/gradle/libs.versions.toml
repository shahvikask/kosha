[versions]
agp = "8.13.2"
kotlin = "2.2.20"
hilt = "2.57.2"
composeBom = "2025.09.00"
activity = "1.10.1"
lifecycle = "2.9.0"
navigation = "2.9.0"
datastore = "1.1.4"
core = "1.16.0"
coroutines = "1.10.2"
junit5 = "5.11.4"
junit4 = "4.13.2"
mockk = "1.13.17"
androidxTest = "1.2.1"
espresso = "3.6.1"
javaxInject = "1"
sqlcipher = "4.17.0"
androidxSqlite = "2.7.0"

[libraries]
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
