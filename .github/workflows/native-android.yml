name: GrowUrDhan Native Android M3

on:
  push:
    branches: [GUD-Android-ChatGPT]
    paths:
      - 'android-native/**'
      - '.github/workflows/native-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preflight native SQLite v1-to-v2 migration and ledger guards
        run: python3 android-native/scripts/validate_schema.py
      - name: Native source security policy and repository authorization gate
        run: python3 android-native/scripts/security_preflight.py
      - name: Verify immutable CASPARSER engine and packaging inputs
        run: |
          git diff --exit-code af96dcc8967ab595e1d9acee78e29e500cb99a9e HEAD -- \
            src/casparser-main \
            scripts/cas_android.py \
            scripts/android_casparser_isin.py \
            scripts/android_pydantic.py \
            scripts/cas_parse_server.py \
            scripts/requirements-cas.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK API 36
        run: |
          SDK_TOOL=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -1)
          test -n "$SDK_TOOL"
          "$SDK_TOOL" --install "platforms;android-36" "build-tools;36.0.0"
      - name: M3 financial-domain golden and ViewModel JVM tests
        run: gradle -p android-native :domain:test :app:testDebugUnitTest --stacktrace
      - name: Upload native JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GrowUrDhan-Native-M3-JVM-Reports
          path: |
            android-native/domain/build/test-results/test/**
            android-native/domain/build/reports/tests/test/**
            android-native/app/build/test-results/testDebugUnitTest/**
            android-native/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
      - name: Compile debug application and Compose instrumentation test APK
        run: gradle -p android-native :app:assembleDebug :app:assembleDebugAndroidTest :data:assembleDebugAndroidTest --stacktrace
      - name: Upload native test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GrowUrDhan-Native-M3-APKs
          path: |
            android-native/app/build/outputs/apk/debug/*.apk
            android-native/app/build/outputs/apk/androidTest/debug/*.apk
            android-native/data/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - name: Reclaim disk space for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "Available space before cleanup:"
          df -h "$HOME"
          # GitHub-hosted Ubuntu image includes SDKs unused by this Android build.
          # Preserve Android SDK, Gradle caches, JDK, and the checked-out repository.
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          echo "Available space after cleanup:"
          df -h "$HOME"
          available_kib=$(df -Pk "$HOME" | awk 'NR==2 { print $4 }')
          # The emulator action downloads an Android system image, then creates a
          # userdata partition. Prevent a ten-minute timeout on low-space runners.
          if (( available_kib < 11 * 1024 * 1024 )); then
            echo "::error::Emulator disk preflight failed: need at least 11 GiB free before downloading the emulator image."
            exit 1
          fi
      - name: Download Android 35 Google APIs system image with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          # The emulator action installs this exact package. An upstream mirror
          # sometimes delivers a corrupt ZIP ("Error on ZipFile unknown archive").
          # Pre-install and validate it here; the action can reuse the package.
          SDK_TOOL=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -1)
          test -n "$SDK_TOOL"
          package='system-images;android-35;google_apis;x86_64'
          image_dir="$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
          for attempt in 1 2 3; do
            if [[ -s "$image_dir/system.img" && -s "$image_dir/source.properties" ]]; then
              echo "Verified Android 35 Google APIs x86_64 image is already installed."
              break
            fi
            echo "Installing Android 35 system image (attempt $attempt of 3)."
            if "$SDK_TOOL" --install "$package" --channel=0 && \
                [[ -s "$image_dir/system.img" && -s "$image_dir/source.properties" ]]; then
              echo "Android 35 emulator system image installed and verified."
              break
            fi
            if (( attempt == 3 )); then
              echo "::error::Android 35 emulator system image failed download/verification after 3 attempts."
              exit 1
            fi
            # Only remove incomplete downloads: never delete an installed image.
            rm -rf "$ANDROID_HOME/.temp" "$HOME/.android/cache"
            if [[ ! -s "$image_dir/system.img" ]]; then
              rm -rf "$image_dir"
            fi
            sleep "$((attempt * 10))"
          done
      - name: Allow Android emulator KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute Compose and SQLCipher vault tests on Android emulator (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle -p android-native :data:connectedDebugAndroidTest :app:connectedDebugAndroidTest --stacktrace
      - name: Upload Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GrowUrDhan-Native-M3-Instrumentation-Reports
          path: |
            android-native/app/build/outputs/androidTest-results/connected/**
            android-native/data/build/outputs/androidTest-results/connected/**
            android-native/app/build/reports/androidTests/connected/**
            android-native/data/build/reports/androidTests/connected/**
          if-no-files-found: ignore
