name: GrowUrDhan Windows installer

on:
  push:
    branches: [GUD-Windows]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS
        run: npm install

      - name: Install Python sidecar deps
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r scripts/requirements-cas.txt
          python -m pip install -e src/casparser-main

      - name: Freeze CAS engine
        run: python scripts/pack_engine.py

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: GrowUrDhan-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
