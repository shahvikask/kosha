name: GrowUrDhan first-market-release backup-disabled acceptance
# Owner D57: financial vault archive backup/restore is a next-upgrade feature.
# Only current release scope is tested; historic archive tests are not marked PASS.
on:
  push:
    branches: [GUD-Android-Redevelopment]
    paths: [.github/workflows/native-base-release-scope.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  base-release-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify provenance and frozen legacy boundaries
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 272a271508d28b5bbcaf724def8e7eb568b38b56 "$GITHUB_SHA" -- src/ src-tauri/ scripts/
          printf '%s\n' "$GITHUB_SHA" > base-release-source-sha.txt
          grep -q 'android:allowBackup="false"' android-native/app/src/main/AndroidManifest.xml
          ! grep -q 'onStartRestore' android-native/app/src/main/kotlin/in/growurdhan/redevelopment/NativeAuthenticationScreens.kt
          ! grep -q 'NativeV9RestoreScreen(' android-native/app/src/main/kotlin/in/growurdhan/redevelopment/MainActivity.kt
          ! grep -q 'restorePicker' android-native/app/src/main/kotlin/in/growurdhan/redevelopment/MainActivity.kt
          grep -q 'financialVaultBackupAndRestoreAreAbsentFromFirstRelease' android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativeBaseReleaseScopeInstrumentedTest.kt
          bash -n .github/scripts/native-base-release-scope.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reuse verified pinned Android Python wheels
        uses: actions/download-artifact@v4
        with:
          repository: shahvikask/kosha
          run-id: 39526640647
          github-token: ${{ github.token }}
          name: source-pinned-android-python-wheels
          path: android-native/app/python-wheels
      - name: Compile app/tests and run in-scope JVM suites
        working-directory: android-native
        run: |
          set -euo pipefail
          (cd app/python-wheels && sha256sum --check SHA256SUMS)
          chmod +x gradlew
          ./gradlew :core:model:test :core:database:test :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Original APK digests
        run: sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > base-release-apk-sha256.txt
      - name: Configure emulator
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Verify archive recovery absent on real API35 UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/native-base-release-scope.sh
      - name: Preserve original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-release-scope-exact-sha-evidence
          path: |
            base-release-source-sha.txt
            base-release-apk-sha256.txt
            base-release-scope-adb.txt
            android-native/core/model/build/test-results/test/TEST-*.xml
            android-native/core/database/build/test-results/test/TEST-*.xml
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn
          retention-days: 14
