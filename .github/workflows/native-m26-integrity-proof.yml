          github-token: ${{ github.token }}
          name: source-pinned-android-python-wheels
          path: android-native/app/python-wheels
      - name: Targeted Android app/test compile
        working-directory: android-native
        shell: bash
        run: |
          set -euo pipefail
          (cd app/python-wheels && sha256sum --check SHA256SUMS)
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Preserve original APK hashes
        run: sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > m26-apk-sha256.txt
      - name: Configure emulator
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Focused M26 encrypted custody, guardian and edit instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/native-m26-integrity-proof.sh
      - name: Archive original test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-sha-m26-custody-guardian-proof
          path: |
            m26-source-sha.txt
            m26-apk-sha256.txt
            m26-adb.txt
            m26-archive-adb.txt
            m26-compose-adb.txt
            android-native/app/build/outputs/androidTest-results/**/*.xml
          if-no-files-found: warn
          retention-days: 14
