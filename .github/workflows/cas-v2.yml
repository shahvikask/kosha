name: CAS V2 Validation

on:
  push:
    branches:
      - phase1-cas-ingestion-v2
  pull_request:
    branches:
      - main

jobs:
  cas-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: CAS V2 model validation
        run: npm run test:cas-v2

      - name: CDSL V2 parser regression tests
        run: npm run test:cas-v2-parser
