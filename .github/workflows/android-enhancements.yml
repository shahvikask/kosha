name: GrowUrDhan support-channel notes

# Play delivers one AAB to every installer. Security patches always ship.
# This workflow only records enhancement notes for people who hold the
# annual support subscription. The app gates those features in licence.ts
# (enhancementsEnabled). It does not hide security fixes.

on:
  push:
    tags: ['support-*']
  workflow_dispatch:
    inputs:
      note:
        description: 'What supporters receive'
        required: true

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish supporter note artifact
        run: |
          mkdir -p dist-support
          {
            echo "# GrowUrDhan support drop"
            echo
            echo "Only devices with an active gud_support_annual subscription unlock in-app enhancements."
            echo
            echo "${{ github.event.inputs.note || github.ref_name }}"
            echo
            echo "Security patches continue to ship to every licensed install via android-aab.yml."
          } > dist-support/NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: support-notes
          path: dist-support/NOTES.md
