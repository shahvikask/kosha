name: GrowUrDhan unified native CI
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact source commit SHA
        type: string
        required: true
      tier:
        description: T1 JVM/compile, T2 targeted emulator, T3 milestone
        type: choice
        required: true
        options: [T1, T2, T3]
      tests:
        description: Comma-separated fully qualified instrumentation classes
        type: string
        required: false
        default: ''
      api:
        description: Android API level
        type: string
        required: false
        default: '35'
  push:
    branches: [GUD-Android-Redevelopment]
    paths: [.ci/request.json]
permissions:
  contents: read
  actions: read
run-name: native-ci ${{ inputs.sha || github.sha }} ${{ inputs.tier || 'request' }}
concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.guard.outputs.tier }}
      tests: ${{ steps.guard.outputs.tests }}
      api: ${{ steps.guard.outputs.api }}
      target: ${{ steps.guard.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: guard
        name: Fail-closed SHA, branch, request and D57 guards
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_TIER: ${{ inputs.tier }}
          INPUT_TESTS: ${{ inputs.tests }}
          INPUT_API: ${{ inputs.api }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/GUD-Android-Redevelopment
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" = push ]]; then
            test "$(git rev-list --parents -n 1 "$GITHUB_SHA" | wc -w)" -eq 2
            test "$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")" = ".ci/request.json"
            target=$(python3 -c 'import json;print(json.load(open(".ci/request.json"))["sha"])')
            tier=$(python3 -c 'import json;print(json.load(open(".ci/request.json"))["tier"])')
            tests=$(python3 -c 'import json;print(json.load(open(".ci/request.json")).get("tests",""))')
            api=$(python3 -c 'import json;print(json.load(open(".ci/request.json")).get("api",35))')
            git cat-file -e "$target^{commit}"
            test "$target" != "$GITHUB_SHA"
            git merge-base --is-ancestor "$target" "$GITHUB_SHA"
            git merge-base --is-ancestor "$target" origin/GUD-Android-Redevelopment
          else
            target="$INPUT_SHA";tier="$INPUT_TIER";tests="$INPUT_TESTS";api="${INPUT_API:-35}"
            test "$target" = "$GITHUB_SHA"
          fi
          # Query actual workflow history. Exclude this run; no active peer or prior green tuple.
          export REQUEST_TARGET="$target" REQUEST_TIER="$tier" REQUEST_TESTS="$tests"
          python3 - <<'PY'
          import base64,json,os,urllib.request
          root="https://api.github.com/repos/shahvikask/kosha"
          token=os.environ["GH_TOKEN"]
          def fetch(url):
              q=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(q) as resp: return json.load(resp)
          runs=fetch(root+"/actions/workflows/native-ci.yml/runs?branch=GUD-Android-Redevelopment&per_page=100").get("workflow_runs",[])
          wanted=(os.environ["REQUEST_TARGET"],os.environ["REQUEST_TIER"],os.environ["REQUEST_TESTS"])
          for r in runs:
              if str(r["id"])==os.environ["GITHUB_RUN_ID"]: continue
              if r["status"] in ("queued","in_progress","waiting","requested","pending"):
                  raise SystemExit(f"Another native-ci run is active: {r['id']}")
              if r["conclusion"]!="success": continue
              # For push runs compare the immutable request contents at that push commit.
              if r["event"]=="push":
                  try:
                      old=fetch(root+"/contents/.ci/request.json?ref="+r["head_sha"])
                      j=json.loads(base64.b64decode(old["content"]))
                      if (j.get("sha"),j.get("tier"),j.get("tests",""))==wanted:
                          raise SystemExit(f"Duplicate green request: {r['id']}")
                  except (KeyError,ValueError,urllib.error.HTTPError): pass
              # Dispatch runs are recorded by their exact run-name tuple, where present.
              else:
                  if r.get("display_title")==f"native-ci {wanted[0]} {wanted[1]}":
                      raise SystemExit(f"Duplicate green dispatch: {r['id']}")
          PY
          echo "target=$target" >> "$GITHUB_OUTPUT"
          case "$tier" in T1|T2|T3) ;; *) exit 1;; esac
          [[ "$api" =~ ^[0-9]+$ ]]
          if [[ "$tier" != T1 ]]; then test -n "$tests" || test "$tier" = T3; fi
          git diff --exit-code 272a271508d28b5bbcaf724def8e7eb568b38b56 "$target" -- src/ src-tauri/ scripts/ public/brand/
          grep -Fq 'android:allowBackup="false"' android-native/app/src/main/AndroidManifest.xml
          echo "JVM_TESTS_DISCOVERED=$(grep -r -E '@Test([ (]|$)' android-native/core/*/src/test --include='*.kt' | wc -l)"
          echo "ANDROID_TESTS_DISCOVERED=$(grep -r -E '@Test([ (]|$)' android-native/app/src/androidTest --include='*.kt' | wc -l)"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
  jvm:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.target }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: android-native/app/python-wheels
          key: native-casparser-android-v2-${{ hashFiles('.github/scripts/build-native-wheels.sh', 'android-native/app/build.gradle.kts') }}
      - name: Verify cached wheels or build from pinned upstream sources
        shell: bash
        run: bash .github/scripts/build-native-wheels.sh
      - name: JVM tests and Kotlin compilation
        working-directory: android-native
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :core:model:test :core:database:test :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin --build-cache --no-daemon -x lint
      - name: E15/E17/E18 offline dependency, secret and egress evidence
        shell: bash
        env:
          TARGET_SHA: ${{ needs.preflight.outputs.target }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s android-native/scripts -p 'test_enterprise_evidence.py' -v
          (cd android-native && ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon --console=plain) > native-debug-deps.txt
          python3 android-native/scripts/enterprise_evidence.py audit --root . --dependencies native-debug-deps.txt --sha "$TARGET_SHA" --out native-enterprise-evidence
      - name: E15 public Maven advisories (no financial identifiers)
        shell: bash
        run: |
          set -euo pipefail
          python3 android-native/scripts/public_advisory_scan.py --sbom native-enterprise-evidence/debug-runtime-sbom.json --quality native-enterprise-evidence/quality-evidence.json --out native-enterprise-evidence/public-advisories.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ci-jvm-${{ github.run_id }}
          path: |
            android-native/core/*/build/test-results/test/TEST-*.xml
            native-enterprise-evidence/*.json
          if-no-files-found: warn
  android:
    if: needs.preflight.outputs.tier != 'T1'
    needs: [preflight, jvm]
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.target }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: android-native/app/python-wheels
          key: native-casparser-android-v2-${{ hashFiles('.github/scripts/build-native-wheels.sh', 'android-native/app/build.gradle.kts') }}
      - name: Verify cached wheels or build from pinned upstream sources
        shell: bash
        run: bash .github/scripts/build-native-wheels.sh
      - name: Compile original APKs and hashes
        working-directory: android-native
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --build-cache --no-daemon -x lint
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk | tee ../native-apks.sha256
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ needs.preflight.outputs.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb install -r android-native/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class "${{ needs.preflight.outputs.tests }}" in.growurdhan.redevelopment.test/androidx.test.runner.AndroidJUnitRunner | tee native-adb.txt
            grep -Eq 'OK \([1-9][0-9]* tests\)' native-adb.txt
            grep -Fq 'INSTRUMENTATION_CODE: -1' native-adb.txt
            ! grep -Eq 'FAILURES!!!|INSTRUMENTATION_CODE: 0' native-adb.txt
            # Each emulator-runner script line runs independently with /bin/sh.
            # Export only synthetic isolated fixtures; never capture an admitted vault.
            mkdir -p g14-screenshots
            adb pull /sdcard/Android/data/in.growurdhan.redevelopment/files/g14-evidence/. g14-screenshots/ || true
            (cd g14-screenshots && find . -type f -name '*.png' -print0 | sort -z | xargs -0 -r sha256sum) > g14-screenshots.sha256
            test ! -s g14-screenshots.sha256 || (cd g14-screenshots && sha256sum --check ../g14-screenshots.sha256)
            test -s g14-screenshots.sha256 || ! echo "${{ needs.preflight.outputs.tests }}" | grep -q NativeM26VisualEvidenceInstrumentedTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ci-emulator-${{ github.run_id }}
          path: |
            native-apks.sha256
            native-adb.txt
            android-native/app/build/outputs/apk/debug/*.apk
            android-native/app/build/outputs/apk/androidTest/debug/*.apk
            g14-screenshots/*.png
            g14-screenshots.sha256
          if-no-files-found: warn
  summary:
    if: always()
    needs: [preflight, jvm, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.target }}
          persist-credentials: false
      - name: Retrieve same-run original emulator evidence
        if: needs.preflight.outputs.tier != 'T1' && needs.android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: native-ci-emulator-${{ github.run_id }}
          path: original-emulator-artifact
      - name: Mandatory gates and machine-readable outcome
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          JVM: ${{ needs.jvm.result }}
          ANDROID: ${{ needs.android.result }}
          TARGET_SHA: ${{ needs.preflight.outputs.target }}
          TIER: ${{ needs.preflight.outputs.tier }}
          TESTS: ${{ needs.preflight.outputs.tests }}
        shell: bash
        run: |
          set -euo pipefail
          python3 android-native/scripts/ci_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ci-summary-${{ github.run_id }}
          path: native-summary.json
