name: GrowUrDhan M27 P11 signed property evidence JVM and Android Kotlin compile
# Exact-SHA provider repair: API35 AndroidKeyStore Ed25519 default is not test key generator.
on:
  push:
    branches: [GUD-Android-Redevelopment]
    paths: [.github/workflows/native-m27-property-identity-jvm.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  property-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact SHA D57 immutable reference preflight
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'android:allowBackup="false"' android-native/app/src/main/AndroidManifest.xml
          test "$(grep -c '@Test fun' android-native/core/model/src/test/kotlin/in/growurdhan/model/NativeSharedPropertyAggregationTest.kt)" -eq 7
          test "$(grep -c '@Test fun' android-native/core/model/src/test/kotlin/in/growurdhan/model/NativePropertySignedEvidenceTest.kt)" -eq 8
          grep -Fq 'BouncyCastleProvider()' android-native/core/model/src/main/kotlin/in/growurdhan/model/NativePropertySignedEvidence.kt
          grep -Fq 'requireProofSchema(db)' android-native/app/src/main/kotlin/in/growurdhan/redevelopment/NativePropertyProofRepository.kt
          test "$(grep -c '@Test fun' android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativePropertyProofRepositoryInstrumentedTest.kt)" -eq 8
          grep -Fq 'CHECK(1=1) /* CHECK(gross_value_minor>0) */' android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativePropertyProofRepositoryInstrumentedTest.kt
          grep -Fq 'syntheticV8UpgradeKeepsOwnerCustodyAndAllowsFirstV9Extension' android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativePropertyProofRepositoryInstrumentedTest.kt
          grep -Fq 'Mismatched encrypted proof foreign-key targets' android-native/app/src/main/kotlin/in/growurdhan/redevelopment/NativePropertyProofRepository.kt
          test "$(grep -c '@Test fun' android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativeHistoricalSourceMigrationInstrumentedTest.kt)" -eq 3
          grep -Fq 'Source blob: 50b896eb1b017b9ec6426e108c9e13a5ae10f002' android-native/app/src/androidTest/assets/p11-frozen-source-v1.sql
          grep -Fq 'incompatibleFrozenV1UpgradeRollsBackAllNewTablesAndVersion' android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativeHistoricalSourceMigrationInstrumentedTest.kt
          echo "$GITHUB_SHA" > property-source-sha.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Scoped P11 JVM and Android app/androidTest Kotlin compile (not an APK packaging gate)
        working-directory: android-native
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :core:model:test --tests 'in.growurdhan.model.NativeSharedPropertyAggregationTest' \
            --tests 'in.growurdhan.model.NativePropertySignedEvidenceTest' \
            :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin \
            -x :app:installDebugPythonRequirements --no-daemon --stacktrace
      - name: Verify original property comparison 7 and signed evidence 8 JUnit cases
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='android-native/core/model/build/test-results/test/TEST-in.growurdhan.model.NativeSharedPropertyAggregationTest.xml'
          r=ET.parse(p).getroot()
          assert int(r.attrib['tests']) == len(r.findall('testcase')) == 7
          assert all(int(r.attrib.get(k,'0'))==0 for k in ('failures','errors','skipped'))
          q='android-native/core/model/build/test-results/test/TEST-in.growurdhan.model.NativePropertySignedEvidenceTest.xml'
          signed=ET.parse(q).getroot()
          assert int(signed.attrib['tests']) == len(signed.findall('testcase')) == 8
          assert all(int(signed.attrib.get(k,'0')) == 0 for k in ('failures','errors','skipped'))
          PY
      - name: Original artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m27-property-identity-exact-sha
          path: |
            property-source-sha.txt
            android-native/core/model/build/test-results/test/TEST-in.growurdhan.model.NativeSharedPropertyAggregationTest.xml
            android-native/core/model/build/test-results/test/TEST-in.growurdhan.model.NativePropertySignedEvidenceTest.xml
          if-no-files-found: warn
