name: GrowUrDhan native v9 archive targeted diagnostic
# New exact-source schema/cipher roundtrip and rollback, not release acceptance.
on:
  workflow_dispatch:
  push:
    branches: [GUD-Android-Redevelopment]
    paths:
      - .github/workflows/native-v9-archive-diagnostic.yml
      - .github/scripts/native-v9-archive-diagnostic.sh
      - android-native/core/database/src/main/kotlin/in/growurdhan/database/NativeV9RecoveryProof.kt
      - android-native/core/database/src/test/kotlin/in/growurdhan/database/NativeV9RecoveryProofTest.kt
      - android-native/app/src/main/kotlin/in/growurdhan/redevelopment/NativeV9NewDeviceRestore.kt
      - android-native/app/src/main/kotlin/in/growurdhan/redevelopment/NativeV9RecoveryInspector.kt
      - android-native/app/src/main/kotlin/in/growurdhan/redevelopment/NativeV9RestoreConsentJournal.kt
      - android-native/app/src/main/kotlin/in/growurdhan/redevelopment/MainActivity.kt
      - android-native/app/src/main/kotlin/in/growurdhan/redevelopment/NativeV9RestoreFlow.kt
      - android-native/app/src/main/kotlin/in/growurdhan/redevelopment/NativeV9ManualResume.kt
      - android-native/app/src/main/kotlin/in/growurdhan/redevelopment/NativeV9RestoreScreen.kt
      - android-native/app/src/main/kotlin/in/growurdhan/redevelopment/NativeRestoreScreen.kt
      - android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativeV9RestoreUiInstrumentedTest.kt
      - android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativeV9RealOsJourneyInstrumentedTest.kt
      - android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativeV9RealSafSelectionInstrumentedTest.kt
      - android-native/app/build.gradle.kts
      - android-native/core/database/src/test/kotlin/in/growurdhan/database/NativeV9ArchiveTest.kt
      - android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativeV9ArchiveInstrumentedTest.kt

permissions:
  contents: read
  actions: read

jobs:
  native-v9-archive:
    if: github.ref == 'refs/heads/GUD-Android-Redevelopment'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact authorized source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Guard frozen sources and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/GUD-Android-Redevelopment"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 272a271508d28b5bbcaf724def8e7eb568b38b56 "$GITHUB_SHA" -- src/ src-tauri/ scripts/
          echo "NATIVE_V9_ARCHIVE_SOURCE_SHA=$GITHUB_SHA"
      - name: Preflight diagnostic harness shell syntax before expensive Android steps
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/native-v9-archive-diagnostic.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          harness = Path(".github/scripts/native-v9-archive-diagnostic.sh").read_text()
          suite = re.search(r'^MAIN_TESTS="([^"]+)"', harness, re.M)
          assert suite, "No explicit Android target test inventory"
          selected = suite.group(1).split(",")
          assert len(selected) == len(set(selected)) == 18, "Expected 18 unique grouped tests"
          for target in selected:
              clazz, method = target.split("#", 1)
              source = Path("android-native/app/src/androidTest/kotlin") / Path(*clazz.split(".")).with_suffix(".kt")
              assert source.is_file(), f"Missing test source {source}"
              assert re.search(r"@Test\s+fun\s+" + re.escape(method) + r"\s*\(", source.read_text()), target
          os_source = Path("android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativeV9RealOsJourneyInstrumentedTest.kt")
          os_text = os_source.read_text()
          for method in (
              "realSystemCredentialCancellationAndActivityRestartRemainLocked",
              "realDocumentsUiCancellationRevokesFreshOsAdmissionAndPreservesNoArchive"
          ):
              assert re.search(r"@Test\s+fun\s+" + method + r"\s*\(", os_text), method
          saf_source = Path("android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativeV9RealSafSelectionInstrumentedTest.kt")
          assert re.search(r"@Test\s+fun\s+realDocumentsUiStagesTamperedNativeAndDeniesPreviewAndReplay\s*\(", saf_source.read_text()), "Missing real SAF selection regression"
          print("NATIVE_V9_STATIC_TARGET_INVENTORY=18 grouped + 2 real OS + 1 real SAF selection + 2 isolated process phases")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reuse verified Android Python wheels
        uses: actions/download-artifact@v4
        with:
          repository: shahvikask/kosha
          run-id: 39526640647
          github-token: ${{ github.token }}
          name: source-pinned-android-python-wheels
          path: android-native/app/python-wheels
      - name: Verify wheel provenance
        run: cd android-native/app/python-wheels && sha256sum -c SHA256SUMS
      - name: Run targeted JVM model and database tests first
        shell: bash
        working-directory: android-native
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :core:model:test :core:database:test --no-daemon --stacktrace
      - name: Check original JVM JUnit XML before Android compilation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for module in ("model", "database"):
              reports=list((Path("android-native/core")/module/"build/test-results/test").rglob("TEST-*.xml"))
              assert reports, f"Missing {module} JUnit XML"
              cases=[c for p in reports for c in ET.parse(p).getroot().findall(".//testcase")]
              assert cases and not any(c.find(t) is not None for c in cases for t in ("failure","error","skipped"))
              if module == "database":
                  names=[c.attrib.get("name") for c in cases if "NativeV9ArchiveTest" in c.attrib.get("classname","")]
                  assert len(names)==5, f"Expected 5 native archive tests, got {len(names)}"
                  for group in ("NativeV9RecoveryProofTest", "NativeV9RestorePublicationSafetyTest"):
                      selected=[t for t in cases if group in t.attrib.get("classname","")]
                      assert len(selected)==3, f"Expected three {group} tests, got {len(selected)}"
              print(f"JVM_{module.upper()}_PASSED={len(cases)}")
          PY
      - name: Compile exact-source Android app and test APKs
        shell: bash
        working-directory: android-native
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Capture exact Android APK SHA256 hashes
        shell: bash
        run: |
          set -euo pipefail
          APP=android-native/app/build/outputs/apk/debug/app-debug.apk
          TEST=android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s "$APP" && test -s "$TEST"
          sha256sum "$APP" "$TEST" > native-v9-apk-hashes.txt
          echo "NATIVE_V9_TESTED_SOURCE_SHA=$GITHUB_SHA" > native-v9-provenance.txt
          echo "APP_APK=$APP" >> "$GITHUB_ENV"
          echo "TEST_APK=$TEST" >> "$GITHUB_ENV"
      - name: Configure KVM
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run only native GUDNAT01 restore tests on API35 x86_64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # The in-progress UI fixture needs an isolated first-class diagnostic.
          # No other tests are reported as run. Remove this only for a coherent
          # full 23-case exact-SHA candidate, never to hide a failing SAF test.
          script: NATIVE_V9_SAF_ONLY=1 bash .github/scripts/native-v9-archive-diagnostic.sh
      - name: Preserve raw test, JUnit and exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-v9-archive-exact-sha-evidence
          path: |
            native-v9-archive-adb.txt
            native-v9-picker-diagnostic.txt
            native-v9-apk-hashes.txt
            native-v9-provenance.txt
            android-native/core/model/build/test-results/test/TEST-*.xml
            android-native/core/database/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14
