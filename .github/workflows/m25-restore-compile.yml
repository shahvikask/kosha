name: M25 Restore Targeted Compile
# Scoped compile and JVM: NativeAccountRepository.enrollVerified transaction.
# Check synthetic strict restore-review archive and payload binding on exact source.
# Recheck Compose test imports and restore callback at exact SHA.
on:
  workflow_dispatch:
  push:
    branches: [GUD-Android-Redevelopment]
    paths: [.github/workflows/m25-restore-compile.yml]
permissions:
  contents: read
concurrency:
  group: m25-restore-compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact source guard
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Targeted JVM unit tests and Kotlin app/Android test compilation — no emulator
        working-directory: android-native
        run: |
          chmod +x gradlew
          ./gradlew :core:model:test :core:database:test :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace

      - name: Upload original JVM JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m25-targeted-jvm-junit
          path: |
            android-native/core/model/build/test-results/test/TEST-*.xml
            android-native/core/database/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
