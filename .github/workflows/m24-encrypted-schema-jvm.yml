name: GrowUrDhan M24 encrypted schema JVM

# Owner standing-authorized exact-SHA M24 regression (24 current JVM tests)
# plus compilation of the native Android app Kotlin against pinned SQLCipher.
# A deliberate YAML-only push triggers this workflow on the redevelopment branch.
# WIP source pushes do not trigger this workflow; avoid emulator/AAB jobs.
on:
  workflow_dispatch:
  push:
    branches:
      - GUD-Android-Redevelopment
    paths:
      - .github/workflows/m24-encrypted-schema-jvm.yml

permissions:
  contents: read

concurrency:
  group: m24-sqlcipher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m24-sqlcipher-jvm:
    name: Verify frozen encrypted schema v9 (JVM only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact tested source
        run: |
          echo "TESTED_SOURCE_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and execute encrypted schema and database boundary JVM tests
        working-directory: android-native
        run: |
          chmod +x ./gradlew
          ./gradlew :core:database:test --no-daemon --stacktrace --rerun-tasks
      - name: Confirm exact M24 regression test set from JUnit XML
        if: success()
        working-directory: android-native
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports=list(Path("core/database/build/test-results/test").glob("**/TEST-*.xml"))
          assert reports, "No database test reports were produced"
          seen=set()
          failures=errors=skipped=0
          for f in reports:
              root=ET.parse(f).getroot()
              failures += int(root.attrib.get("failures","0"))
              errors += int(root.attrib.get("errors","0"))
              skipped += int(root.attrib.get("skipped","0"))
              for tc in root.findall("testcase"):
                  seen.add((tc.attrib.get("classname","").split(".")[-1], tc.attrib.get("name","")))
          required={
              ("TestOnlyV9MigrationTest","frozenHistoryProducesDeterministicNonDestructiveVersionPlans"),
              ("TestOnlyV9MigrationTest","allSupportedPriorVersionMarkersMigrateAndPreserveSyntheticOwnersAndMoney"),
              ("TestOnlyV9MigrationTest","exactEncryptedBackupCopyRetainsUnknownFieldsOwnerAndScaledIntegers"),
              ("TestOnlyV9MigrationTest","injectedDdlFailureRollsBackSchemaVersionAndEverySyntheticRecord"),
              ("TestOnlyV9MigrationTest","corruptMetadataUnknownVersionsAndIncompatibleSchemasFailClosed"),
              ("TestOnlyV9MigrationTest","corruptedCiphertextIsRejectedWithoutResettingTheSourceFile"),
          }
          required |= {
              ("FrozenLegacyBackupEnvelopeGoldenTest","frozenBackupAndLegacySourceContractHasNotDrifted"),
              ("FrozenLegacyBackupEnvelopeGoldenTest","binaryV2EnvelopeRoundTripRetainsLargeIntegersOwnerAndUnknownFields"),
              ("FrozenLegacyBackupEnvelopeGoldenTest","encryptedEnvelopeRejectsTamperWrongIdentityAndInvalidHeaders"),
              ("FrozenLegacyBackupEnvelopeGoldenTest","oldKosha1JsonEnvelopeUsesPasswordOnlyAndRequiresEmbeddedAccount"),
              ("FrozenLegacyBackupEnvelopeGoldenTest","proposedTwoPhaseReplayAndFailureStagingNeverMarksUnapprovedBackups"),
              ("TestOnlyV9MigrationTest","unrecognizedLegacyExtensionColumnAndOpaqueValueSurviveUpgradeAndReopen"),
              ("TestOnlyV9MigrationTest","missingAppendOnlyTriggerFailsClosedWithoutRewritingRows"),
          }
          required |= {
              ("LegacyBackupEnvelopeReaderTest","readerPreservesBigIntegersOwnersAndUnknownJsonVerbatim"),
              ("LegacyBackupEnvelopeReaderTest","passwordOnlyKosha1RetainsSameExactPayload"),
              ("LegacyBackupEnvelopeReaderTest","wrongEmailWrongPasswordAndTamperingNeverYieldPlaintext"),
              ("LegacyBackupEnvelopeReaderTest","shortInvalidHeaderAndKdfParametersAreRejected"),
          }
          missing=required-seen
          assert not missing, f"Missing required M24 tests: {sorted(missing)}"
          assert len(seen)==24, f"Expected exactly 24 database test methods, found {len(seen)}"
          assert failures==errors==skipped==0, f"JUnit failures={failures}, errors={errors}, skipped={skipped}"
          print(f"M24_JUNIT_CONFIRMED total={len(seen)} new=11 failures=0 errors=0 skipped=0")
          PY
      - name: Confirm available Android SDK 35
        run: |
          if [ -z "${ANDROID_SDK_ROOT:-}" ] && [ -n "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi
          test -n "${ANDROID_SDK_ROOT:-}" || { echo "::error::Android SDK is not configured"; exit 1; }
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-35" ]; then
            test -x "$SDKMANAGER" || { echo "::error::sdkmanager missing"; exit 1; }
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"

      - name: Compile native Android Kotlin against pinned SQLCipher dependencies
        working-directory: android-native
        run: |
          echo "NATIVE_COMPILE_SOURCE_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Upload database JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m24-encrypted-schema-junit
          path: |
            android-native/core/database/build/test-results/test/**/*.xml
            android-native/core/database/build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 14
