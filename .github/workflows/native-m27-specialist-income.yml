name: GrowUrDhan M27 specialist source-golden income schedule acceptance
on:
  push:
    branches: [GUD-Android-Redevelopment]
    paths: [.github/workflows/native-m27-specialist-income.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  specialist-income:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source, D57, original code and test-count preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/GUD-Android-Redevelopment
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 272a271508d28b5bbcaf724def8e7eb568b38b56 "$GITHUB_SHA" -- src/ src-tauri/ scripts/ public/brand/
          grep -Fq 'android:allowBackup="false"' android-native/app/src/main/AndroidManifest.xml
          grep -Fq 'export function monthlyIncomeDates' src/lib/interest.ts
          grep -Fq 'if (n > 28) return 28' src/lib/interest.ts
          grep -Fq 'fun monthlyIncomeDates(' android-native/app/src/main/kotlin/in/growurdhan/redevelopment/NativeHoldingSpecialist.kt
          test "$(grep -c '@Test fun' android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativeM27SpecialistMetadataInstrumentedTest.kt)" -eq 6
          test "$(grep -c '@Test fun' android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativeM27SpecialistFormInstrumentedTest.kt)" -eq 2
          echo "$GITHUB_SHA" > m27-specialist-income-source-sha.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pin verified source Android Python wheels
        uses: actions/download-artifact@v4
        with:
          repository: shahvikask/kosha
          run-id: 39526640647
          github-token: ${{ github.token }}
          name: source-pinned-android-python-wheels
          path: android-native/app/python-wheels
      - name: Targeted JVM and native source compilation
        working-directory: android-native
        shell: bash
        run: |
          set -euo pipefail
          (cd app/python-wheels && sha256sum --check SHA256SUMS)
          chmod +x gradlew
          ./gradlew :core:model:test :core:database:test :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Hash APK source receipts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > m27-specialist-income-apk-sha256.txt
      - name: Configure emulator
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Source golden, typed edit, encrypted restart and Bank FD Compose default
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            adb install -r android-native/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class in.growurdhan.redevelopment.NativeM27SpecialistMetadataInstrumentedTest,in.growurdhan.redevelopment.NativeM27SpecialistFormInstrumentedTest in.growurdhan.redevelopment.test/androidx.test.runner.AndroidJUnitRunner | tee m27-specialist-income-adb.txt
            grep -Fq 'OK (8 tests)' m27-specialist-income-adb.txt
            grep -Fq 'INSTRUMENTATION_CODE: -1' m27-specialist-income-adb.txt
      - name: Preserve original pass or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-sha-m27-specialist-income
          path: |
            m27-specialist-income-source-sha.txt
            m27-specialist-income-apk-sha256.txt
            m27-specialist-income-adb.txt
            android-native/core/model/build/test-results/test/TEST-*.xml
            android-native/core/database/build/test-results/test/TEST-*.xml
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn
          retention-days: 14
