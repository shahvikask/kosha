name: GrowUrDhan Android AAB

on:
  push:
    branches: [GUD-Android]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  aab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager "$SDK"/cmdline-tools/latest/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "platform-tools"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/ndk/27.2.12479018" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install JS
        run: npm ci || npm install

      - name: Ensure RGBA icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick python3-pil
          python3 scripts/ensure_rgba_icons.py

      - name: Init Android project
        run: |
          npx tauri android init --ci || npx tauri android init || true
          node scripts/android_prepare.mjs

      - name: Keystore present
        id: ks
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Decode upload keystore
        if: steps.ks.outputs.present == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > src-tauri/gen/android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >> src-tauri/gen/android/keystore.properties

      - name: Build AAB (Play)
        run: |
          node scripts/android_prepare.mjs
          npx tauri android build --target aarch64

      - name: Stage AAB
        run: |
          mkdir -p dist-play
          find src-tauri/gen/android src-tauri/target -name '*.aab' -print
          find src-tauri/gen/android src-tauri/target -name '*.aab' -exec cp {} dist-play/GrowUrDhan.aab \;
          ls -la dist-play
          test -s dist-play/GrowUrDhan.aab

      - uses: actions/upload-artifact@v4
        with:
          name: GrowUrDhan-Android-AAB
          path: dist-play/GrowUrDhan.aab
          if-no-files-found: error

      - name: Play account present
        id: play
        env:
          JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$JSON" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Upload to Play internal track
        if: steps.play.outputs.present == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: in.growurdhan.app
          releaseFiles: dist-play/GrowUrDhan.aab
          track: internal
          status: draft
