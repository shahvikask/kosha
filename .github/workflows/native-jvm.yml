name: GrowUrDhan native JVM

# GitHub returns 404 for workflow_dispatch when the file is not on the
# default branch. A push of this file on the redevelopment branch starts
# one run. Other files do not.
on:
  workflow_dispatch:
  push:
    branches: [GUD-Android-Redevelopment]
    paths:
      - .github/workflows/native-jvm.yml

jobs:
  native-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK platform 35
        run: |
          if [ -z "${ANDROID_SDK_ROOT:-}" ] && [ -n "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Compile and run the existing unit tests
        working-directory: android-native
        run: ./gradlew :core:model:test :core:database:test :core:parser-api:test :app:assembleDebug :app:testDebugUnitTest --no-daemon
