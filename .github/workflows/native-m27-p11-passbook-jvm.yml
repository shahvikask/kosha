name: GrowUrDhan M27 P11 withdrawal source and FY accuracy JVM and Compose
on:
  push:
    branches: [GUD-Android-Redevelopment]
    paths: [.github/workflows/native-m27-p11-passbook-jvm.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  p11-passbook-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact SHA frozen source D57 and test-count preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/GUD-Android-Redevelopment
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 89b75c53cd042c32acde6198376e2af76b135d90 "$GITHUB_SHA" -- src/ src-tauri/ scripts/ public/brand/
          grep -Fq 'android:allowBackup="false"' android-native/app/src/main/AndroidManifest.xml
          grep -Fq 'function contributionThisFy(' src/lib/interest.ts
          test "$(grep -c '@Test fun' android-native/core/model/src/test/kotlin/in/growurdhan/model/NativePpfSsyPassbookAccrualTest.kt)" -eq 15
          test "$(grep -c '@Test fun' android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativeM27PpfPassbookInstrumentedTest.kt)" -eq 4
          echo "$GITHUB_SHA" > m27-p11-passbook-source-sha.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          repository: shahvikask/kosha
          run-id: 39526640647
          github-token: ${{ github.token }}
          name: source-pinned-android-python-wheels
          path: android-native/app/python-wheels
      - name: P11 15 dated withdrawal/source cases and affected Android app/test compile
        shell: bash
        working-directory: android-native
        run: |
          set -euo pipefail
          (cd app/python-wheels && sha256sum --check SHA256SUMS)
          chmod +x gradlew
          ./gradlew :core:model:test --tests 'in.growurdhan.model.NativePpfSsyPassbookAccrualTest' :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace
      - name: Validate original 15-case XML test cases and no skips
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='android-native/core/model/build/test-results/test/TEST-in.growurdhan.model.NativePpfSsyPassbookAccrualTest.xml'
          x=ET.parse(p).getroot()
          assert int(x.attrib['tests']) == len(x.findall('testcase')) == 15
          assert all(int(x.attrib.get(k,'0'))==0 for k in ('errors','failures','skipped'))
          print('Original P11:',x.attrib)
          PY
      - name: Retain exact source and original XML even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-sha-m27-p11-passbook-source-jvm
          path: |
            m27-p11-passbook-source-sha.txt
            android-native/core/model/build/test-results/test/TEST-in.growurdhan.model.NativePpfSsyPassbookAccrualTest.xml
          if-no-files-found: warn
          retention-days: 14
