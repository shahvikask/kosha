name: GrowUrDhan M27 P11 withdrawals and journal-collision API35 SQLCipher
on:
  push:
    branches: [GUD-Android-Redevelopment]
    paths: [.github/workflows/native-m27-p11-passbook-sqlcipher.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  p11-passbook-sqlcipher:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact SHA immutable source and D57 preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/GUD-Android-Redevelopment
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 89b75c53cd042c32acde6198376e2af76b135d90 "$GITHUB_SHA" -- src/ src-tauri/ scripts/ public/brand/
          grep -Fq 'android:allowBackup="false"' android-native/app/src/main/AndroidManifest.xml
          grep -Fq 'Passbook owner/holding does not match encrypted custody' android-native/app/src/main/kotlin/in/growurdhan/redevelopment/NativeBooksRepository.kt
          test "$(grep -c '@Test fun' android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativeM27PpfPassbookInstrumentedTest.kt)" -eq 4
          test "$(grep -c '@Test fun' android-native/core/model/src/test/kotlin/in/growurdhan/model/NativePpfSsyPassbookAccrualTest.kt)" -eq 15
          echo "$GITHUB_SHA" > m27-p11-passbook-sqlcipher-source-sha.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          repository: shahvikask/kosha
          run-id: 39526640647
          github-token: ${{ github.token }}
          name: source-pinned-android-python-wheels
          path: android-native/app/python-wheels
      - name: New P11 goldens full JVM regression and real app/test APKs
        working-directory: android-native
        shell: bash
        run: |
          set -euo pipefail
          (cd app/python-wheels && sha256sum --check SHA256SUMS)
          chmod +x gradlew
          ./gradlew :core:model:test :core:database:test :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Original APK SHA256 receipts
        shell: bash
        run: |
          sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > m27-p11-passbook-apk-sha256.txt
      - name: Allow Android emulator acceleration
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Owner-scoped passbook read-only SQLCipher and encrypted restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            adb install -r android-native/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class in.growurdhan.redevelopment.NativeM27PpfPassbookInstrumentedTest in.growurdhan.redevelopment.test/androidx.test.runner.AndroidJUnitRunner | tee m27-p11-passbook-adb.txt
            grep -Fq 'OK (4 tests)' m27-p11-passbook-adb.txt
            grep -Fq 'INSTRUMENTATION_CODE: -1' m27-p11-passbook-adb.txt
      - name: Preserve original JUnit ADB source and APKs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-sha-m27-p11-passbook-sqlcipher-api35
          path: |
            m27-p11-passbook-sqlcipher-source-sha.txt
            m27-p11-passbook-apk-sha256.txt
            m27-p11-passbook-adb.txt
            android-native/core/model/build/test-results/test/TEST-*.xml
            android-native/core/database/build/test-results/test/TEST-*.xml
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn
          retention-days: 14
