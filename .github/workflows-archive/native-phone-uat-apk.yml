name: GrowUrDhan Native Phone UAT APK
on:
  push:
    branches: [GUD-Android-Redevelopment]
    paths: [.github/workflows/native-phone-uat-apk.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-uat-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact branch SHA and frozen-source guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/GUD-Android-Redevelopment
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 272a271508d28b5bbcaf724def8e7eb568b38b56 "$GITHUB_SHA" -- src/ src-tauri/ scripts/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reuse verified pinned Android Python ABI wheels
        uses: actions/download-artifact@v4
        with:
          repository: shahvikask/kosha
          run-id: 39526640647
          github-token: ${{ github.token }}
          name: source-pinned-android-python-wheels
          path: android-native/app/python-wheels
      - name: Verify wheels and assemble installable native debug APK
        working-directory: android-native
        shell: bash
        run: |
          set -euo pipefail
          (cd app/python-wheels && sha256sum --check SHA256SUMS)
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk > /dev/null
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app-debug.sha256
          echo "$GITHUB_SHA" > uat-source-sha.txt
      - name: Upload native installable UAT APK
        uses: actions/upload-artifact@v4
        with:
          name: GrowUrDhan-Native-UAT-APK
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app-debug.sha256
            android-native/uat-source-sha.txt
          if-no-files-found: error
          retention-days: 14
