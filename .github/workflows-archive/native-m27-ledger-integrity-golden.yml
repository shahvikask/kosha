name: GrowUrDhan M27 P13 P14 FIFO provenance source-golden JVM proof
on:
  push:
    branches: [GUD-Android-Redevelopment]
    paths: [.github/workflows/native-m27-ledger-integrity-golden.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact SHA original source D57 and golden count
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/GUD-Android-Redevelopment
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code c34952391c72afdd18f25856d6b0ee6dbc004628 "$GITHUB_SHA" -- src/ src-tauri/ scripts/ public/brand/
          grep -Fq 'android:allowBackup="false"' android-native/app/src/main/AndroidManifest.xml
          grep -Fq 'foldHolding(' src/lib/lots.ts
          grep -Fq 'NativeCostProvenance.knownCost' android-native/app/src/main/kotlin/in/growurdhan/redevelopment/NativeBooksRepository.kt
          test "$(grep -c '@Test fun' android-native/core/model/src/test/kotlin/in/growurdhan/model/NativeM27LedgerIntegrityGoldenTest.kt)" -eq 7
          echo "$GITHUB_SHA" > m27-ledger-golden-source-sha.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run only seven JVM source and integrity vectors
        working-directory: android-native
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :core:model:test --tests 'in.growurdhan.model.NativeM27LedgerIntegrityGoldenTest' --no-daemon --stacktrace
      - name: Verify real XML seven tests zero failures/errors/skips
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='android-native/core/model/build/test-results/test/TEST-in.growurdhan.model.NativeM27LedgerIntegrityGoldenTest.xml'
          x=ET.parse(p).getroot()
          assert int(x.attrib['tests']) == len(x.findall('testcase')) == 7
          assert all(int(x.attrib.get(k, '0'))==0 for k in ('failures','errors','skipped'))
          print(x.attrib)
          PY
      - name: Preserve exact SHA and original JVM result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-sha-m27-ledger-provenance-goldens
          path: |
            m27-ledger-golden-source-sha.txt
            android-native/core/model/build/test-results/test/TEST-in.growurdhan.model.NativeM27LedgerIntegrityGoldenTest.xml
          if-no-files-found: warn
          retention-days: 14
