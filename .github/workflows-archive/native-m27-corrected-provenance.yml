name: GrowUrDhan M27 corrected price and unknown cost focused proof
on:
  push:
    branches: [GUD-Android-Redevelopment]
    paths: [.github/workflows/native-m27-corrected-provenance.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  m27-corrected-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact SHA, frozen reference, D57 and class preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/GUD-Android-Redevelopment
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 272a271508d28b5bbcaf724def8e7eb568b38b56 "$GITHUB_SHA" -- src/ src-tauri/ scripts/
          grep -Fq 'Unknown acquisition cost cannot be invented by an opening correction' android-native/app/src/main/kotlin/in/growurdhan/redevelopment/NativeBooksRepository.kt
          grep -Fq 'Valuation correction must retain the original observation date' android-native/app/src/main/kotlin/in/growurdhan/redevelopment/NativeBooksRepository.kt
          test "$(grep -c '@Test fun' android-native/app/src/androidTest/kotlin/in/growurdhan/redevelopment/NativeM27CorrectedProvenanceInstrumentedTest.kt)" -eq 4
          grep -Fq 'android:allowBackup="false"' android-native/app/src/main/AndroidManifest.xml
          echo "$GITHUB_SHA" > m27-corrected-source-sha.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verified Android Python wheels
        uses: actions/download-artifact@v4
        with:
          repository: shahvikask/kosha
          run-id: 39526640647
          github-token: ${{ github.token }}
          name: source-pinned-android-python-wheels
          path: android-native/app/python-wheels
      - name: JVM and native app/test compile
        shell: bash
        working-directory: android-native
        run: |
          set -euo pipefail
          (cd app/python-wheels && sha256sum --check SHA256SUMS)
          chmod +x gradlew
          ./gradlew :core:model:test :core:database:test :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Hash source APKs
        run: sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > m27-corrected-apk-sha256.txt
      - name: Configure emulator
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run four synthetic SQLCipher restart and rollback cases
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            adb install -r android-native/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class in.growurdhan.redevelopment.NativeM27CorrectedProvenanceInstrumentedTest in.growurdhan.redevelopment.test/androidx.test.runner.AndroidJUnitRunner | tee m27-corrected-adb.txt
            grep -Fq 'OK (4 tests)' m27-corrected-adb.txt
            grep -Fq 'INSTRUMENTATION_CODE: -1' m27-corrected-adb.txt
      - name: Preserve original proof on pass or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-sha-m27-corrected-provenance
          path: |
            m27-corrected-source-sha.txt
            m27-corrected-apk-sha256.txt
            m27-corrected-adb.txt
            android-native/core/model/build/test-results/test/TEST-*.xml
            android-native/core/database/build/test-results/test/TEST-*.xml
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn
          retention-days: 14
