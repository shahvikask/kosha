[package]
name = "growurdhan"
version = "0.2.0"
description = "GrowUrDhan Android — private Indian family wealth"
authors = ["GrowUrDhan"]
edition = "2021"

[lib]
name = "growurdhan_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
