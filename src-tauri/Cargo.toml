[package]
name = "growurdhan"
version = "0.1.0"
description = "GrowUrDhan desktop — private Indian family wealth"
authors = ["GrowUrDhan"]
edition = "2021"

[lib]
name = "growurdhan_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
