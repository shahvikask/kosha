[package]
name = "growurdhan"
version = "0.1.0"
description = "GrowUrDhan desktop — private Indian family wealth"
authors = ["GrowUrDhan"]
edition = "2021"

[lib]
name = "growurdhan_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
rfd = "0.15"
base64 = "0.22"
